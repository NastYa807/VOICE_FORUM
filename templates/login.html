{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="bg-white p-8 rounded-3xl shadow-2xl border-4 border-blue-600 w-full max-w-md transform rotate-1">
        <h2 class="text-4xl font-black italic tracking-tighter text-blue-600 uppercase mb-6 text-center">
            Вход в Глубинку
        </h2>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-[10px] uppercase font-bold tracking-widest text-blue-800 ml-2 mb-1">Твое имя</label>
                <input type="text" name="username" placeholder="Логин" required
                    class="w-full px-5 py-3 rounded-xl border-2 border-blue-200 focus:border-blue-600 focus:outline-none transition-all placeholder:opacity-50">
            </div>

            <div>
                <label class="block text-[10px] uppercase font-bold tracking-widest text-blue-800 ml-2 mb-1">Секретный шифр</label>
                <input type="password" name="password" placeholder="Пароль" required
                    class="w-full px-5 py-3 rounded-xl border-2 border-blue-200 focus:border-blue-600 focus:outline-none transition-all placeholder:opacity-50">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg hover:shadow-blue-300 transition-all uppercase tracking-widest mt-4 border-b-4 border-blue-800 active:border-b-0 active:translate-y-1">
                ВОРВАТЬСЯ
            </button>
        </form>
    </div>
</div>
{% endblock %}
