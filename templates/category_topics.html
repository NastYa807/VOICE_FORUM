{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-10">
    <h2 class="text-3xl font-black uppercase border-b-4 border-black pb-2">Раздел: {{ cat.name }}</h2>
    <button onclick="document.getElementById('addForm').classList.toggle('hidden')" class="bg-green-400 border-4 border-black px-6 py-2 font-bold uppercase shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-y-1 hover:shadow-none transition-all">
        Создать тему +
    </button>
</div>

<!-- Скрытая форма создания темы -->
<div id="addForm" class="hidden mb-10 bg-white border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
    <form method="POST">
        <input type="text" name="title" placeholder="Заголовок темы" required class="w-full border-2 border-black p-3 mb-4 font-bold uppercase">
        <textarea name="content" placeholder="О чем перетрем?" required class="w-full border-2 border-black p-3 mb-4 h-32"></textarea>
        <button type="submit" class="bg-blue-600 text-white border-2 border-black px-6 py-2 font-bold uppercase">Закинуть в обсуд</button>
    </form>
</div>

<div class="grid gap-8">
    {% for topic in topics %}
    <a href="{{ url_for('topic_detail', topic_id=topic.id) }}" class="block group card-hover">
        <div class="bg-white border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] group-hover:bg-blue-50 transition-colors">
            <h3 class="text-2xl font-black uppercase mb-3">{{ topic.title }}</h3>
            <p class="text-gray-700 italic">
                {{ topic.content | truncate(160, true, "...") }}
            </p>
            <div class="mt-6 flex justify-between items-center font-bold">
                <span class="bg-pink-300 border-2 border-black px-3 py-1 text-sm">❤️ РЕСПЕКТЫ: {{ topic.likes }}</span>
                <span class="text-blue-600 underline uppercase tracking-tighter">Влететь в тему →</span>
            </div>
        </div>
    </a>
    {% else %}
    <div class="bg-white border-4 border-black p-10 text-center font-bold uppercase italic">Тут пока глухо. Создай первую движуху!</div>
    {% endfor %}
</div>
{% endblock %}
